name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "15 22 2 * *"

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        # https://www.php.net/supported-versions.php
        php-version: ["8.3", "8.4", "8.5"]
        dependencies: ["default"]
        include:
          - php-version: "8.3"
            dependencies: "lowest"

    name: PHP OpenCage Geocode

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Install dependencies
        if: matrix.dependencies == 'default'
        run: |
          if [ "${{ matrix.php-version }}" != "8.5" ]; then rm composer.lock; fi
          composer install --no-progress --no-interaction

      - name: Install lowest supported Guzzle
        if: matrix.dependencies == 'lowest'
        run: composer update guzzlehttp/guzzle --with-all-dependencies --prefer-lowest --prefer-stable --no-progress --no-interaction

      - name: Show installed Guzzle
        run: composer show 'guzzlehttp/*'

      - name: Run phpunit tests
        run: ./vendor/bin/phpunit --display-deprecations

      - name: Start tinyproxy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tinyproxy
          # Ubuntu's default config listens on port 8888 and allows connections from localhost
          sudo systemctl start tinyproxy
          timeout 10 bash -c 'until (echo > /dev/tcp/127.0.0.1/8888) 2>/dev/null; do sleep 1; done'

      - name: Run proxy tests
        run: PROXY=http://127.0.0.1:8888 ./vendor/bin/phpunit

      - name: Run PHPCS (Code Sniffer)
        run: ./vendor/bin/phpcs .

      - name: Run PHPStan (Static Analysis)
        run: ./vendor/bin/phpstan analyse
